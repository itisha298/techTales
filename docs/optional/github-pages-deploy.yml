# ---------------------------------------------------------------------------
# DISABLED: kept for reference only (moved out of .github/workflows/).
#
# Why: the presentation is now deployed with Vercel, with Vercel
# Authentication protecting every deployment. A GitHub Pages site built from
# a PRIVATE repository is still publicly reachable on most GitHub plans
# (access control for Pages requires GitHub Enterprise Cloud). Running both
# would publish client material at an unprotected github.io address.
#
# Only restore this (copy back into .github/workflows/) if your organisation
# has Enterprise Cloud with private Pages enabled, and with approval.
# ---------------------------------------------------------------------------
# GitHub Pages: Settings → Pages → Source: "GitHub Actions".
# The build uses a relative base ('./'), so it works at /<repo-name>/ without changes.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
